# ---- Server ----
server.port=8080

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/sasidharanmart_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Seed data (data.sql) ----
# Run data.sql after Hibernate creates the tables, and only on first startup
# (delete rows from the products table if you want the seed data reloaded).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
